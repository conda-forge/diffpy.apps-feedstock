{% set name = "diffpy.apps" %}
{% set version = "0.2.3" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/diffpy_apps/diffpy_apps-{{ version }}.tar.gz
  sha256: 73de9d35bfcb51897c9eac43652bdae8988ba2b0f6c7bf7b1be3a084f26c5ef7

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  entry_points:
    - diffpy-app = diffpy.apps.apps:main
    - diffpy-apps = diffpy.apps.apps:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-git-versioning >=2.0
    - pip

  run:
    - python >={{ python_min }}
    - diffpy.cmi
    - diffpy.srfit >=3.4.0
    - diffpy.srreal
    - numpy
    - scipy
    - textx
    - psutil
    - pyyaml
    - networkx
    - mcp


test:
  requires:
    - python {{ python_min }}
    - pip
    - pytest
    - pytest-mock
    - pytest-env

  source_files:
    - tests

  commands:
    - pip check
    - pytest

about:
  home: https://github.com/diffpy.apps/diffpy.apps/
  summary: Python package for doing science.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  description: |
    User applications to help with tasks using diffpy packages. Currently it provides: 1. Macro interface for PDF refinements. 2. Agent interface for PDF refinements.
  doc_url: http://diffpy.apps.github.io/diffpy.apps/
  dev_url: https://github.com/diffpy.apps/diffpy.apps/

extra:
  recipe-maintainers:
    - sbillinge
